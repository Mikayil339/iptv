name: Refresh protected IPTV playlist
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
  id-token: write
concurrency:
  group: playlist-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater
        run: python -m unittest discover -s tests -v
      - name: Load protected playlist using GitHub identity
        run: python scripts/gateway_sync.py download
      - name: Discover HD and sports streams and verify video fragments
        run: python scripts/refresh.py
      - name: Publish protected playlist
        run: python scripts/gateway_sync.py upload
      - name: Commit aggregate health summary only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LAST_RUN.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update aggregate playlist health summary'
            git push
          fi
