name: Refresh IPTV playlist
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'sources.json'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
concurrency:
  group: playlist-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater
        run: python -m unittest discover -s tests -v
      - name: Check streams and refresh playlist
        run: python scripts/refresh.py
      - name: Commit health report and playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u8 health.json STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh stream health and playlist'
            git push
          fi
