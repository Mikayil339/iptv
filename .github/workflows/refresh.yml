name: Refresh IPTV playlist
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'sources.json'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
concurrency:
  group: playlist-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install image processing dependencies
        run: python -m pip install -r requirements.txt
      - name: Test updater and logos
        run: python -m unittest discover -s tests -v
      - name: Discover and verify channels
        run: python scripts/refresh.py
      - name: Cache and repair channel logos
        run: python scripts/update_logos.py
      - name: Publish playlist and health reports to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u8 sources.json health.json STATUS.md LAST_RUN.json logo_status.json logos
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh IPTV streams, sports channels and logos'
            git push
          fi
